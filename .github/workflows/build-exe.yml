name: Build Windows app

# Builds a folder holding micsync-gui.exe (the window) and micsync.exe (command
# line), tests both, and keeps the folder as a downloadable artifact. A tag like v1.0.0 (pushed with git,
# or made by creating a release on the GitHub website) also attaches the zipped
# folder to that release.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['micsync.py', 'micsync_gui.pyw', 'micsync.spec', 'tests/**', '.github/workflows/build-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: python -m pip install numpy scipy soundfile tkinterdnd2 pyinstaller

      - name: Test the script before packaging
        shell: bash
        run: |
          python tests/smoke_make.py smoke
          python micsync.py "smoke/ref.wav" "smoke/mic 2.wav" --out smoke/out-py
          python tests/smoke_check.py smoke smoke/out-py

      - name: Build the two programs into one folder
        run: pyinstaller --noconfirm --clean micsync.spec

      - name: Test micsync.exe
        shell: bash
        run: |
          ./dist/micsync/micsync.exe "smoke/ref.wav" "smoke/mic 2.wav" --out smoke/out-exe
          python tests/smoke_check.py smoke smoke/out-exe

      - name: Test micsync-gui.exe and time its start
        shell: pwsh
        run: |
          foreach ($i in 1..3) {
            $t = Measure-Command { $p = Start-Process -FilePath dist\micsync\micsync-gui.exe -ArgumentList '--selftest=selftest.txt' -Wait -PassThru }
            "launch ${i}: exit code $($p.ExitCode), whole run $([math]::Round($t.TotalSeconds, 2)) s; $(Get-Content selftest.txt)"
            if ($p.ExitCode -ne 0) { Write-Host "(0 = fine, 1 = libraries missing, 2 = no drag and drop)"; exit 1 }
          }

      - name: TEMPORARY - time a single-file build for comparison
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --windowed --name onefile-gui --collect-all tkinterdnd2 --distpath cmp --workpath cmpbuild --specpath cmpbuild micsync_gui.pyw | Out-Null
          foreach ($i in 1..3) {
            $t = Measure-Command { $p = Start-Process -FilePath cmp\onefile-gui.exe -ArgumentList '--selftest=selftest1.txt' -Wait -PassThru }
            "single-file launch ${i}: exit code $($p.ExitCode), whole run $([math]::Round($t.TotalSeconds, 2)) s; $(Get-Content selftest1.txt)"
          }

      - name: Zip the folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist\micsync -DestinationPath release\micsync-windows.zip
          "{0:N0} MB unzipped, {1:N0} MB zipped" -f ((Get-ChildItem dist\micsync -Recurse | Measure-Object Length -Sum).Sum / 1MB), ((Get-Item release\micsync-windows.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: micsync-windows
          path: dist

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Works both ways: a tag pushed with git, or a release created on the GitHub website.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/micsync-windows.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/micsync-windows.zip --title "micsync $GITHUB_REF_NAME" --generate-notes
          fi
